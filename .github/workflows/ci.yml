name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Test & Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/ tests/

      - name: Run Pytest & Determinism Verification
        env:
          PYTHONPATH: backend
        run: |
          pytest tests/ --cov=backend --cov-report=term-missing --cov-report=xml

  frontend-lint-and-build:
    name: Frontend Sloplint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Run Hallmark Anti-AI-Slop Gate
        run: |
          node tools/sloplint.mjs frontend/src

      - name: Build Frontend Application
        run: |
          npm --prefix frontend run build
